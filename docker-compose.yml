services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heart-disease-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: heart-disease-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend